<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support HarshhPlays</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 90%;
      max-width: 500px;
      padding: 40px 30px;
      text-align: center;
      background: #101010;
      border: 1px solid #39ff88;
      border-radius: 20px;
      box-shadow: 0 0 35px rgba(57, 255, 136, 0.25);
    }

    h1 {
      color: #39ff88;
      font-size: 36px;
      margin-bottom: 10px;
    }

    p {
      color: #cccccc;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .upi {
      background: #181818;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 16px;
    }

    .button {
      display: inline-block;
      padding: 14px 28px;
      background: #39ff88;
      color: #050505;
      text-decoration: none;
      font-weight: bold;
      border-radius: 10px;
      transition: 0.2s;
    }

    .button:hover {
      transform: scale(1.05);
    }

    .thanks {
      margin-top: 25px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Support HarshhPlays</h1>

    <p>
      Enjoying the streams?<br>
      Your support helps me create more content and keep the streams going.
    </p>

    <div class="upi">
      <strong>UPI ID</strong><br><br>
      9834417914@ybl
    </div>

    <a
      class="button"
      href="upi://pay?pa=9834417914@ybl&pn=HarshhPlays">
      PAY WITH UPI
    </a>

    <div class="thanks">
      Thank you for supporting HarshhPlays.
    </div>

  </div>

</body>
</html>
